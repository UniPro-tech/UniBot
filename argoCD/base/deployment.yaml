apiVersion: apps/v1
kind: Deployment
metadata:
  name: unibot
spec:
  selector:
    matchLabels:
      app: unibot
  template:
    metadata:
      labels:
        app: unibot
    spec:
      containers:
        - name: unibot
          image: registry.uniproject.jp/infra/unibot:8.4.0
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: unibot-env
          env:
            - name: TZ
              value: Asia/Tokyo
            # ロギング設定。秘密情報ではないため SealedSecret ではなくここで管理する。
            # env は envFrom より優先されるため、必要なら Secret 側で上書きできる。
            - name: CONFIG_LOG_LEVEL
              value: "info"
            - name: CONFIG_LOG_FORMAT
              value: "json"
            - name: CONFIG_LOG_SQL
              value: "warn"
            - name: CONFIG_LOG_DISCORD_LEVEL
              value: "notice"
            # 未設定の間は Discord への通知が無効になるだけで、Bot は正常に動作する。
            # 運用側でチャンネル ID を設定すること。
            # - name: CONFIG_LOG_ERROR_CHANNEL_ID
            #   value: ""
            # - name: CONFIG_LOG_READY_CHANNEL_ID
            #   value: ""
      imagePullSecrets:
        - name: internal-harbor
